<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MTGA watcher WebSocket接続確認</title>
  </head>
  <body>
    <h1>MTGA watcher WebSocket接続確認</h1>
    <p id="status" aria-live="polite">接続を開始しています。</p>
    <pre id="result"></pre>
    <script>
      const status = document.querySelector("#status");
      const result = document.querySelector("#result");
      const socket = new WebSocket("ws://127.0.0.1:5500");

      socket.addEventListener("open", () => {
        status.textContent = "接続に成功しました。";
      });
      socket.addEventListener("message", (event) => {
        status.textContent = "イベントを受信しました。";
        result.textContent = event.data;
      });
      socket.addEventListener("error", () => {
        status.textContent = "接続に失敗しました。watcherと接続元の設定を確認してください。";
      });
      socket.addEventListener("close", (event) => {
        if (event.code === 1006) {
          status.textContent = "接続が拒否されたか、watcherが停止しています。";
        }
      });
    </script>
  </body>
</html>
